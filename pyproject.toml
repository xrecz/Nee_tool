[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nee-tool"
version = "0.1.0"
description = "Automated Pentest Reconnaissance Toolkit"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "typer>=0.9",
    "pydantic>=2.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
nee = "nee_tool.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
