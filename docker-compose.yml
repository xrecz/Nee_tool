version: '3.8'
services:
  terrarecon:
    build: .
    ports:
      - "8899:8899"
    volumes:
      - ./output:/app/output
    environment:
      - NVD_API_KEY=${NVD_API_KEY:-}
      - WEB_USERNAME=${WEB_USERNAME:-admin}
      - WEB_PASSWORD=${WEB_PASSWORD:-terrarecon}
    restart: unless-stopped
