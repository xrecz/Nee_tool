{% extends "base.html" %}
{% set active = "dashboard" %}
{% block title %}Finding hinzufügen — Nee Tool{% endblock %}

{% block content %}
<h1>Finding hinzufügen</h1>

<form action="/project/add-finding" method="POST" style="max-width:700px;">
  <input type="hidden" name="file" value="{{ file }}">

  <div class="card">
    <h3>Aus Template erstellen (optional)</h3>
    <div class="form-group">
      <label for="template_key">Finding-Template</label>
      <select name="template_key" id="template_key" onchange="toggleManual(this)">
        <option value="">— Kein Template (manuell) —</option>
        {% for key, tpl in templates.items() %}
        <option value="{{ key }}">{{ tpl.severity.value | upper }} | {{ tpl.title }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="card" id="manual-fields">
    <h3>Finding-Details</h3>

    <div class="form-group">
      <label for="title">Titel *</label>
      <input type="text" name="title" id="title" placeholder="z.B. SQL Injection in Login-Formular">
    </div>

    <div class="form-group">
      <label for="severity">Schweregrad</label>
      <select name="severity" id="severity">
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
        <option value="info">Info</option>
      </select>
    </div>

    <div class="form-group">
      <label for="description">Beschreibung</label>
      <textarea name="description" id="description" rows="4" placeholder="Was wurde gefunden?"></textarea>
    </div>

    <div class="form-group">
      <label for="recommendation">Empfehlung</label>
      <textarea name="recommendation" id="recommendation" rows="3" placeholder="Was soll der Kunde tun?"></textarea>
    </div>
  </div>

  <div class="card">
    <h3>Target & Evidence</h3>

    <div class="form-group">
      <label for="target_host">Betroffener Host / URL</label>
      <input type="text" name="target_host" id="target_host" placeholder="z.B. app.example.de/login">
    </div>

    <div class="form-group">
      <label for="evidence">Proof of Concept / Evidence</label>
      <textarea name="evidence" id="evidence" rows="5" placeholder="HTTP Request/Response, Screenshot-Beschreibung, etc." style="font-family:monospace;font-size:0.85rem;"></textarea>
    </div>
  </div>

  <div style="display:flex;gap:0.5rem;margin-top:1rem;">
    <button type="submit" class="btn btn-primary">Finding speichern</button>
    <a href="/project?file={{ file }}" class="btn">Abbrechen</a>
  </div>
</form>

<script>
function toggleManual(sel) {
  const fields = document.getElementById('manual-fields');
  fields.style.opacity = sel.value ? '0.4' : '1';
  // If template selected, title/description are optional (filled from template)
  document.getElementById('title').required = !sel.value;
}
</script>
{% endblock %}
