{% extends "base.html" %}
{% set active = "scan" %}
{% block title %}Neuer Scan — Nee Tool{% endblock %}

{% block content %}
<h1>Neuer Scan</h1>

<form action="/scan/start" method="POST" class="card" style="max-width:700px;">
  <div class="form-group">
    <label for="target">Target Domain *</label>
    <input type="text" name="target" id="target" placeholder="example.de" required>
  </div>

  <div class="form-group">
    <label for="name">Projektname (optional)</label>
    <input type="text" name="name" id="name" placeholder="Automatisch aus Target">
  </div>

  <div class="form-group">
    <label>Scanner-Module</label>
    <div class="checkbox-group">
      {% for s in scanners %}
      <label>
        <input type="checkbox" name="scanners" value="{{ s }}" checked>
        <span>{{ s }}</span>
      </label>
      {% endfor %}
    </div>
  </div>

  <div class="grid grid-2">
    <div class="form-group">
      <label for="top_ports">Top Ports (nmap)</label>
      <input type="number" name="top_ports" id="top_ports" value="1000" min="1" max="65535">
    </div>
  </div>

  <button type="submit" class="btn btn-primary" style="margin-top:1rem;">Scan starten</button>
</form>
{% endblock %}
